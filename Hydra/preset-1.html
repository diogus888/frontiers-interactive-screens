<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hydra preset 1</title>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth/dist/hydra-synth.js"></script>
  <script src="lib/midi.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #hydra-canvas { display: block; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; background: #000; }
    #code {
      position: fixed; inset: 0; margin: 0; padding: 24px; box-sizing: border-box;
      overflow: auto; color: #fff; background: rgba(0,0,0,0.55);
      font: 13px/1.45 Menlo, Consolas, monospace; white-space: pre; z-index: 10;
    }
    #code[hidden] { display: none; }
    #err { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; padding: 8px 12px; color: #f66; background: rgba(0,0,0,0.8); font: 12px/1.4 monospace; white-space: pre-wrap; z-index: 20; }
    #err[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="hydra-canvas"></canvas>
  <!-- code is hidden by default; press Ctrl+Shift+H to show / hide it -->
  <pre id="code" hidden></pre>
  <pre id="err" hidden></pre>

  <script id="sketch" type="text/plain">
await loadScript("https://metagrowing.org/extra-shaders-for-hydra/lib-noise.js")
await loadScript("https://metagrowing.org/extra-shaders-for-hydra/lib-screen.js")
await loadScript("https://cdn.jsdelivr.net/gh/geikha/hyper-hydra@latest/hydra-blend.js")
await loadScript("https://cdn.jsdelivr.net/gh/geikha/hyper-hydra@latest/hydra-arithmetics.js")

const seed1 = 123
const seed2 = 124

const blendDt    = (amt) => amt
const contrastDt = (amt) => amt
const sortDirX   = () => 1
const sortDirY   = () => 1
const gridScale  = () => 1

const pal = {
  cBlack:  { r: 0.8875, g: 0.8875, b: 0.8875 },
  cMid:    { r: 0.9875, g: 0.4157894736842105, b: 0.8329836415362727 },
  cWhite:  { r: 0.7474845201238389, g: 0.4276315789473685, b: 1 },
  cDither: { r: 0.29605263157894735, g: 0.9375, b: 0.5794828641370868 },
}

// VISUAL LAYER 1
osc(120, 0.1, 1)
  .rotate(1.57, 2)
  .modulate(noise(10, 6.6).pixelate(23, 11).rotate(seed1, 12.350000000000001))
  .modulateRotate(noise(1, 0.5).rotate(seed1, 0.75), 1)
  .scale(3.5)
  .pixelate(1324, 1460)
  .out(o4)

// VISUAL LAYER 2
osc(65, 0.37, 0)
  .rotate(1.79, 1.52)
  .modulate(noise(11.200000000000001, 0.5).pixelate(31, 12).rotate(seed2, 15.450000000000001))
  .modulateRotate(noise(1, 0.5).rotate(seed2, 0.75), 1.2850000000000001)
  .scale(77.3)
  .pixelate(207, 5015)
  .out(o6)

// VISUAL LAYER 3
unoise(5.2, 0.1).pixelate(256, 256)
  .darken(unoise(5.2, 0.1).pixelate(128, 128))
  .darken(unoise(5.2, 0.1).pixelate(64, 64))
  .darken(unoise(5.2, 0.1).pixelate(32, 32))
  .darken(unoise(5.2, 0.1).pixelate(16, 16))
  .darken(unoise(5.2, 0.1).pixelate(8, 8))
  .darken(unoise(5.2, 0.1).pixelate(4, 4))
  .darken(unoise(5.2, 0.1).pixelate(2, 2))
  .amp(20)
  .mod(1.001)
  .out(o0)

// MERGE LAYER 1 & 2
src(o1)
  .pysort(0.449, () => window.frame++, 0, sortDirY())
  .blend(src(o4).blend(o6, 7.2540000000000004).blend(o0, 0.535), blendDt(0.08))
  .contrast(contrastDt(1.131))
  .out(o1)

// GREEN PIXELS LAYER
src(o5)
  .invert()
  .pxsort(0.01, () => window.frame++, sortDirX(), 0)
  .blend(o1, blendDt(0.05))
  .contrast(contrastDt(1.0479999999999998))
  .out(o5)

const greenPixels = () =>
  solid(pal.cDither.r, pal.cDither.g, pal.cDither.b)
    .mask(src(o5).diff(src(o1).scrollY(4.4094999999999995)).thresh(0.4, 0.4).dither4(gridScale()))

// COLOR LAYER 1
const midMask = () => src(o1).thresh(0.1).mult(src(o1).thresh(0.8).invert())

solid(pal.cBlack.r, pal.cBlack.g, pal.cBlack.b)
  .mult(src(o1).thresh(0.1).invert())
  .add(solid(pal.cMid.r, pal.cMid.g, pal.cMid.b).mult(midMask()))
  .add(solid(pal.cWhite.r, pal.cWhite.g, pal.cWhite.b).mult(src(o1).thresh(0.8)))
  .out(o2)

// POST PROCESSING
const highMask = () => src(o1).thresh(0.8, 0.15)

src(o2)
  .modulate(noise(596, 5), 0.002)
  .mult(osc(9110000).add(solid(0.6, 0.6, 0.6)))
  .add(noise(1650, 20).luma(0.6, 0.1), 0.15)
  .modulate(osc(6.75, 0.3, 0), 0.007499999999999875)
  .scale(1.02, 1.02, 1)
  .brightness(-0.1)
  .mult(highMask().invert())
  .add(src(o2).add(noise(500, 20).luma(0.6, 0.1), 0.15).mult(highMask()))
  .layer(greenPixels())
  .out(o3)


window.baseSpeed = 0.05399999999999999
speed = window.baseSpeed

render(o3)
  </script>

  <script>
    // ---- canvas size: window size by default, or ?res=1920x1080 for a fixed
    // render resolution scaled to fill the window (cropping the overflow)
    // ?scale=0.5 renders at half the window size (a quarter of the pixels) and lets CSS stretch it
    const canvas = document.getElementById('hydra-canvas')
    const params = new URLSearchParams(location.search)
    const resParam = params.get('res')
    const fixed = resParam && /^\d+x\d+$/.test(resParam) ? resParam.split('x').map(Number) : null
    const scaleParam = Number(params.get('scale'))
    const scale = scaleParam > 0 && scaleParam <= 1 ? scaleParam : 1
    const fitW = () => Math.max(1, Math.round(window.innerWidth * scale))
    const fitH = () => Math.max(1, Math.round(window.innerHeight * scale))
    canvas.width = fixed ? fixed[0] : fitW()
    canvas.height = fixed ? fixed[1] : fitH()

    // ?manual=1: no internal frame loop -- an offline renderer (tools/render-clips.mjs) steps the
    // sketch itself with window.__tick(dt) for deterministic, drop-free frame sequences
    const manual = params.get('manual') === '1'
    const hydra = new Hydra({
      canvas,
      detectAudio: false,
      precision: 'mediump',
      numOutputs: 8,
      numSources: 8,
      autoLoop: !manual,
    })
    window.hydraSynth = hydra
    window.__tick = (dt) => hydra.tick(dt)
    window.__sketchReady = false

    if (!fixed) {
      window.addEventListener('resize', () => hydra.setResolution(fitW(), fitH()))
    }

    // ---- code overlay (hidden by default)
    const source = document.getElementById('sketch').textContent.trim()
    const codeEl = document.getElementById('code')
    codeEl.textContent = source
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && e.code === 'KeyH') {
        e.preventDefault()
        codeEl.hidden = !codeEl.hidden
      }
    })

    // ---- run the sketch (wrapped so top-level await works, like the editor)
    const errEl = document.getElementById('err')
    const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor
    // standby throttle: a pane the /split wall page preloads hidden (?standby=1) renders at a few
    // fps until the wall makes it live; hydra copies the global `fps` into the synth every tick
    const STANDBY_FPS = 4
    if (new URLSearchParams(location.search).get('standby') === '1') window.fps = STANDBY_FPS
    window.addEventListener('message', (e) => {
      if (!e.data) return
      if (e.data.type === 'hydra-live') window.fps = undefined
      else if (e.data.type === 'hydra-standby') window.fps = STANDBY_FPS
    })

    // tell an embedding /split page when this preset is actually on screen (two painted frames
    // after the sketch ran) so it can swap a pane in without a black gap
    let currentRoute = location.pathname.slice(1)
    const announce = (type) => { if (parent !== window) parent.postMessage({ type, route: currentRoute }, '*') }
    const run = (code) => new AsyncFunction(code)().then(() => {
      errEl.hidden = true
      window.__sketchReady = true
      requestAnimationFrame(() => requestAnimationFrame(() => announce('hydra-ready')))
    }).catch((err) => {
      console.error(err)
      errEl.textContent = String(err && err.stack || err)
      errEl.hidden = false
      announce('hydra-error')
    })
    run(source)

    // in-place preset swap: an embedding page posts {type:'hydra-load', code, route} and this SAME hydra
    // re-runs the new sketch -- no page load, no shader libraries to refetch, no new WebGL context. The
    // libraries are already loaded here, so their loadScript lines are dropped from the incoming code.
    // values-only preset change (the /live sketch): {type:'hydra-values', preset, route} swaps V, nothing recompiles
    window.addEventListener('message', (e) => {
      if (!e.data || e.data.type !== 'hydra-values' || !e.data.preset) return
      currentRoute = String(e.data.route || currentRoute)
      document.title = 'hydra preset ' + currentRoute
      if (typeof window.applyPreset === 'function') { window.applyPreset(e.data.preset, e.data.fadeMs); announce('hydra-ready') }
      else window.__pendingPreset = e.data.preset          // sketch still loading: it applies this when it starts
    })
    window.addEventListener('message', (e) => {
      if (!e.data || e.data.type !== 'hydra-load' || typeof e.data.code !== 'string') return
      currentRoute = String(e.data.route || currentRoute)
      const code = e.data.code.replace(/^await loadScript\(.*\)\s*$/gm, '').trim()
      codeEl.textContent = code
      document.title = 'hydra preset ' + currentRoute
      run(code)
    })
  </script>
</body>
</html>
